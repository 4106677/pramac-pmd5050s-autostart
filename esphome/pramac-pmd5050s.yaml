substitutions:
  # Кількість імпульсів TAHO на 1 оберт колінвала.
  # З логів: ~18350 імп/хв на холостому ходу = ~306 Гц. Для 3000-3120 об/хв
  # (50 Гц генератор) це 5.9-6.1 імп/оберт, тобто 6 (допоміжна обмотка проти
  # 12-полюсного кільця магнітів маховика).
  # Звірка: частота на виході генератора (Гц) × 60 = об/хв.
  pulses_per_rev: "6"
  # Поріг "двигун працює", об/хв. Стартер крутить ~200-400 об/хв, двигун
  # на роботі ~3000 об/хв, тому 1000 надійно відділяє одне від одного.
  running_rpm_threshold: "1000"
  # Контактор: прогрів двигуна перед підключенням навантаження і пауза перед зупинкою.
  warmup_s: "40"
  cooldown_s: "3"

esphome:
  name: pramac-pmd5050s
  friendly_name: Pramac PMD5050s

esp32:
  board: esp32dev
  framework:
    type: arduino

# Enable logging
logger:
  logs:
    # Прибираємо DEBUG-спам "Retrieved counter / Sending state" кожну секунду,
    # коли двигун стоїть. Оберти логуються нижче, тільки коли вони не 0.
    sensor: INFO
    pulse_counter: INFO

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Pramac-Pmd5050S"
    password: !secret ap_password

captive_portal:

# ---------------------------------------------------------------------------
# Змінні стану
# ---------------------------------------------------------------------------
globals:
  - id: crank_attempts
    type: int
    restore_value: false
    initial_value: '0'

# ---------------------------------------------------------------------------
# Реле на платі (NPN-драйвер, активний HIGH): D2 = ACC, D4 = START, D26 = контактор
# ---------------------------------------------------------------------------
switch:
  - platform: gpio
    id: relay_acc
    name: "Реле ACC"
    pin:
      number: GPIO2          # D2 на платі (там же світлодіод D2)
      inverted: false        # NPN-драйвер на платі: HIGH = реле увімкнене, LOW (і при завантаженні) = вимкнене
    restore_mode: ALWAYS_OFF

  - platform: gpio
    id: relay_start
    name: "Реле START"
    pin:
      number: GPIO4          # D4 на платі
      inverted: false        # те саме, що й для ACC
    restore_mode: ALWAYS_OFF

  # Реле контактора (K3, сухі COM/NO на котушку 230 В). Керується тільки логікою нижче, в HA не публікується.
  - platform: gpio
    id: relay_contactor
    internal: true
    pin:
      number: GPIO26         # D26 на платі
      inverted: false
    restore_mode: ALWAYS_OFF

  # Запуск/зупинка з Home Assistant. Працює як віртуальний "замкнений контакт".
  # ALWAYS_OFF: після перезавантаження плати запит з HA скидається (двигун сам не стартує).
  - platform: template
    id: ha_run_request
    name: "Запуск з HA"
    icon: "mdi:engine"
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - logger.log: "Запит запуску з HA"
      - script.stop: stop_sequence
      - script.execute: start_sequence
    turn_off_action:
      - logger.log: "Запит зупинки з HA"
      # Фізичний контакт має пріоритет: якщо він замкнений, двигун лишається працювати.
      - if:
          condition:
            binary_sensor.is_off: start_stop_contact
          then:
            - script.execute: stop_sequence

binary_sensor:
  # Зовнішні сухі контакти "старт/стоп"
  - platform: gpio
    id: start_stop_contact
    name: "Контакт старт/стоп"
    pin:
      number: GPIO25
      mode: INPUT_PULLUP
      inverted: true          # замкнуті контакти = true = "потрібен запуск"
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms
    on_press:
      then:
        - script.stop: stop_sequence
        - script.execute: start_sequence
    on_release:
      then:
        - if:
            condition:
              switch.is_off: ha_run_request
            then:
              - script.execute: stop_sequence

  # "Двигун працює" — оберти вищі за поріг (running_rpm_threshold).
  - platform: template
    id: engine_running
    name: "Двигун працює"
    lambda: |-
      return id(engine_rpm).state > ${running_rpm_threshold};
    filters:
      - delayed_off: 3s       # не реагувати на короткі провали імпульсів
    on_release:
      then:
        # Двигун зупинився: навантаження одразу відключаємо.
        - switch.turn_off: relay_contactor
        - if:
            condition:
              or:
                - binary_sensor.is_on: start_stop_contact
                - switch.is_on: ha_run_request
            then:
              - logger.log: "Несподівана зупинка двигуна — пробуємо перезапуск"
              - script.execute: start_sequence

  # Контактор замкнений (стан реле K3)
  - platform: template
    id: contactor_closed
    name: "Контактор замкнений"
    lambda: |-
      return id(relay_contactor).state;

  # Прапорець невдалого запуску — видно в Home Assistant
  - platform: template
    id: start_failed
    name: "Не вдалось завести"

# ---------------------------------------------------------------------------
# TAHO: сирі імпульси з LM393 (D14) і перерахунок в оберти
# ---------------------------------------------------------------------------
sensor:
  - platform: pulse_counter
    pin: GPIO14
    id: taho_pulses
    name: "TAHO імпульсів/хв"
    update_interval: 1s
    accuracy_decimals: 0

  - platform: copy
    source_id: taho_pulses
    id: engine_rpm
    name: "Оберти двигуна"
    unit_of_measurement: "RPM"
    accuracy_decimals: 0
    icon: "mdi:engine"
    filters:
      - lambda: return x / ${pulses_per_rev};
    on_value:
      then:
        - if:
            condition:
              lambda: 'return x > 0;'
            then:
              - logger.log:
                  format: "Оберти: %.0f RPM (імпульсів/хв: %.0f)"
                  args: ['x', 'id(taho_pulses).state']

  # Моточаси: рахуємо час, поки "Двигун працює" = true. Старт з нуля при першій прошивці,
  # далі значення зберігається у флеші (restore) і переживає перезавантаження та OTA.
  # Запис у флеш раз на update_interval, тому інтервал не робимо малим.
  - platform: duty_time
    id: engine_hours
    name: "Моточасы"
    sensor: engine_running
    restore: true
    update_interval: 5min
    unit_of_measurement: "h"
    device_class: duration
    state_class: total_increasing
    accuracy_decimals: 2
    icon: "mdi:timer-outline"
    filters:
      - multiply: 0.00027777778   # секунди -> години

# ---------------------------------------------------------------------------
# Логіка запуску: ACC → пауза → до 3 спроб прокрутки з очікуванням оборотів
# ---------------------------------------------------------------------------
script:
  # Зупинка: спочатку розмикаємо контактор, через cooldown_s знімаємо ACC (двигун глухне).
  - id: stop_sequence
    mode: restart
    then:
      - logger.log: "СТОП: розмикаємо контактор"
      - script.stop: start_sequence
      - switch.turn_off: relay_start
      - switch.turn_off: relay_contactor
      - delay: ${cooldown_s}s
      - logger.log: "СТОП: знімаємо ACC"
      - switch.turn_off: relay_acc
      - lambda: 'id(start_failed).publish_state(false);'

  - id: start_sequence
    mode: restart      # якщо двигун зупинився під час прогріву — послідовність починається заново
    then:
      - lambda: 'id(start_failed).publish_state(false);'
      - globals.set:
          id: crank_attempts
          value: '0'
      - logger.log: "Подаємо ACC"
      - switch.turn_on: relay_acc
      # 3 с, а не 2: після перезавантаження плати треба дати датчику оборотів
      # встигнути 2 виміри. Якщо двигун УЖЕ крутиться — стартер вмикати не можна.
      - delay: 3s

      - while:
          condition:
            lambda: |-
              return (id(crank_attempts) < 3) && !id(engine_running).state;
          then:
            - globals.set:
                id: crank_attempts
                value: !lambda 'return id(crank_attempts) + 1;'
            - logger.log: "Спроба прокрутки стартера"
            - switch.turn_on: relay_start
            - wait_until:
                condition:
                  binary_sensor.is_on: engine_running
                timeout: 8s
            - switch.turn_off: relay_start
            - if:
                condition:
                  not:
                    binary_sensor.is_on: engine_running
                then:
                  - delay: 5s     # пауза між спробами, дати стартеру відпочити

      - if:
          condition:
            binary_sensor.is_on: engine_running
          then:
            - logger.log: "Двигун запущено, прогрів ${warmup_s} с"
            # Чекаємо прогрів; якщо двигун зупиниться раніше, умова спрацює і контактор не замкнеться.
            - wait_until:
                condition:
                  not:
                    binary_sensor.is_on: engine_running
                timeout: ${warmup_s}s
            - if:
                condition:
                  binary_sensor.is_on: engine_running
                then:
                  - logger.log: "Прогрів завершено — замикаємо контактор"
                  - switch.turn_on: relay_contactor
          else:
            - logger.log: "Не вдалось завести за 3 спроби"
            - lambda: 'id(start_failed).publish_state(true);'
            - switch.turn_off: relay_acc
